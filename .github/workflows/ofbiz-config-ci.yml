# Dosya Yolu: /.github/workflows/ofbiz-config-ci.yml
# Amac: TurkuazOFBiz araclarinin statik, release matrisi, doctor ve Docker dogrulamalarini calistirir
# Tool - YAML
# Version: 2.22.1
# Aciklama: Unified installer modlari, syntax, portable katalog/Java uyumu, runtime matrisi ve Docker testlerini kosar
#
# Bagimli Oldugu Katman: Tool | Controller | Service | Repo | Config

name: TurkuazOFBiz CI

on:
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "controllers/**"
      - "language/**"
      - "repositories/**"
      - "services/**"
      - "tools/**"
      - "views/**"
      - "README.md"
      - "install.bat"
      - "install.ps1"
      - "install.sh"
      - "LICENSE"
      - "VERSION"
      - "CHANGELOG.md"
      - "RELEASE_NOTES.md"
      - ".github/workflows/ofbiz-config-ci.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "config/**"
      - "controllers/**"
      - "language/**"
      - "repositories/**"
      - "services/**"
      - "tools/**"
      - "views/**"
      - "README.md"
      - "install.bat"
      - "install.ps1"
      - "install.sh"
      - "LICENSE"
      - "VERSION"
      - "CHANGELOG.md"
      - "RELEASE_NOTES.md"
      - ".github/workflows/ofbiz-config-ci.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turkuazofbiz-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate TurkuazOFBiz
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version state
        shell: bash
        run: bash tools/ci/validate-version-state.sh

      - name: Validate structure and syntax
        shell: bash
        run: bash tools/ci/validate-structure.sh

      - name: ShellCheck active scripts
        shell: bash
        run: |
          find controllers services repositories tools             -type f -name '*.sh'             -not -path '*/legacy/*'             -print0             | xargs -0 shellcheck -s bash -S error -e SC1090,SC1091

      - name: Validate shell and batch installers
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          shellcheck -s bash -S error install.sh
          bash -n tools/package-windows-installer.sh
          shellcheck -s bash -S error tools/package-windows-installer.sh
          grep -Fq "TurkuazOFBiz-Installer.ps1" install.bat
          grep -Fq "Unblock-File" install.bat
          grep -Fq "pause" install.bat
          ! grep -Fq "ExecutionPolicy Bypass" install.bat
          ! grep -Fq "Invoke-WebRequest" install.bat
          ! grep -Fq "releases/latest/download" install.bat
          ! grep -Fq -- "-- wslpath" install.ps1
          grep -Fq '"/mnt/$drive/$relative"' install.ps1
          grep -Fq '$DefaultAppPath = ""' install.ps1
          grep -Fq 'Initialize-InstallerConfig' install.ps1
          grep -Fq 'OFBIZ_INSTALL_APP_PATH_DEFAULT' install.ps1
          grep -Fq 'doctor docker' install.ps1
          ! grep -Fq 'doctor all' install.ps1
          grep -Fq 'OFBIZ_APP_PATH="${OFBIZ_APP_PATH:-}"' install.sh
          grep -Fq 'OFBIZ_INSTALL_APP_PATH_DEFAULT="/partymgr"' config/installer.conf
          grep -Fq 'OFBIZ_INSTALL_MODE_DEFAULT="native"' config/installer.conf
          grep -Fq 'OFBIZ_DOCKER_LEGACY_RELEASE_PREFIX="17.12."' config/docker.conf
          grep -Fq 'OFBIZ_DOCKER_LEGACY_REQUIRED_VARIANT="demo"' config/docker.conf
          grep -Fq 'OFBIZ_DOCKER_LEGACY_RELEASE_PREFIX' install.sh
          grep -Fq 'OFBIZ_DOCKER_LEGACY_REQUIRED_VARIANT' install.sh
          grep -Fq 'OFBIZ_DOCKER_LEGACY_RELEASE_PREFIX' install.ps1
          grep -Fq 'OFBIZ_DOCKER_LEGACY_REQUIRED_VARIANT' install.ps1
          grep -Fq 'doctor docker' install.sh
          grep -Fq '$Variant -eq "demo"' install.ps1
          grep -Fq '$password = "ofbiz"' install.ps1
          grep -Fq '"password" { Invoke-Password }' install.ps1
          grep -Fq 'OFBIZ_VARIANT}" == "demo"' install.sh
          grep -Fq 'password="ofbiz"' install.sh
          grep -Fq 'TurkuazOFBiz - Kurulum Modu' install.ps1
          grep -Fq 'Native Portable' install.ps1
          grep -Fq 'OFBIZ_PORTABLE_RELEASES' install.ps1
          grep -Fq 'Install-NativePackage' install.ps1
          grep -Fq 'install_mode' install.ps1
          grep -Fq 'INSTALL_MODE' install.sh
          grep -Fq 'Native  (Docker gerekmez, onerilen)' install.sh
          grep -Fq 'run background' install.sh
          grep -Fq 'run status' install.sh
          test -f config/installer.conf
          grep -Fq 'OFBIZ_RELEASES_24_09' install.ps1
          grep -Fq 'OFBIZ_RELEASES_18_12' install.ps1
          grep -Fq 'OFBIZ_RELEASES_17_12' install.ps1
          grep -Fq 'OFBIZ_SNAPSHOT_BRANCHES' install.ps1
          grep -Fq 'installer-state.json' install.ps1
          grep -Fq 'installer-state.conf' install.sh
          grep -Fq 'turkuazofbiz-$Variant-$TargetType-$safeTarget' install.ps1
          grep -Fq 'docker build' install.ps1
          grep -Fq 'docker build' install.sh
          grep -Fq 'Get-FileHash -Path $zipPath -Algorithm SHA256' install.ps1
          grep -Fq 'Wait-OFBizReady' install.ps1
          grep -Fq 'Windows native portable katalogunda olmayan OFBiz surumu' install.ps1
          grep -Fq 'Save-InstallerState -NativePath $nativePath' install.ps1
          grep -Fq 'Docker/WSL  : gerekmez' install.ps1
          test -f tools/portable/PortableBootstrap.java
          test -f tools/portable/legacy-stage.init.gradle
          test -f tools/portable/windows/TurkuazOFBiz.cmd
          test -f tools/portable/windows/_ofbiz.cmd
          test -f tools/portable/windows/Start.cmd
          test -f tools/portable/windows/Stop.cmd
          test -f tools/portable/windows/Status.cmd
          grep -Fq 'SecureRandom' tools/portable/PortableBootstrap.java
          grep -Fq 'configDir.resolve("security.properties")' tools/portable/PortableBootstrap.java
          grep -Fq 'TurkuazOFBiz-PortableHelper.jar' tools/portable/windows/Start.cmd
          grep -Fq 'org.apache.ofbiz.base.start.Start' tools/portable/windows/_ofbiz.cmd
          grep -Fq 'lib-extra\*' tools/portable/windows/_ofbiz.cmd
          grep -Fq 'lib\*' tools/portable/windows/_ofbiz.cmd
          ! grep -Fq 'bin\ofbiz.bat' tools/portable/windows/Start.cmd
          ! grep -Fq 'bin\ofbiz.bat' tools/portable/windows/Stop.cmd
          ! grep -Fq 'bin\ofbiz.bat' tools/portable/windows/Status.cmd
          grep -Fq '"_ofbiz.cmd"' tools/portable/build-windows-portable.ps1
          grep -Fq 'distZip' tools/portable/build-windows-portable.ps1
          grep -Fq 'Invoke-PortableOFBiz' tools/portable/build-windows-portable.ps1
          grep -Fq 'readers=seed,seed-initial' tools/portable/build-windows-portable.ps1
          grep -Fq 'portable-java-major.txt' tools/portable/build-windows-portable.ps1
          grep -Fq 'portable-metadata.properties' tools/portable/build-windows-portable.ps1
          grep -Fq 'Build-LegacyDistribution' tools/portable/build-windows-portable.ps1
          grep -Fq 'turkuazPortableStage' tools/portable/legacy-stage.init.gradle
          grep -Fq 'root.configurations.runtime' tools/portable/legacy-stage.init.gradle
          grep -Fq 'OFBIZ_HOME%\lib' tools/portable/windows/_env.cmd
          ! grep -Fq 'bin\ofbiz.bat' tools/portable/windows/_env.cmd
          grep -Fq 'OFBIZ_PORTABLE_RELEASES' config/versions.conf
          grep -Fq 'fromJson(needs.portable-matrix.outputs.matrix)' .github/workflows/release.yml
          grep -Fq 'java-version: ${{ matrix.java }}' .github/workflows/release.yml
          grep -Fq 'name: Verify current main' .github/workflows/release.yml
          grep -Fq 'needs.current-main.outputs.current' .github/workflows/release.yml
          grep -Fq 'turkuazofbiz-release-${{ github.event.workflow_run.head_sha }}' .github/workflows/release.yml
          ! grep -Fq -- '-OFBizVersion "24.09.07"' .github/workflows/release.yml
          grep -Fq '$metadataLines -notcontains "platform=windows-x64"' tools/portable/test-windows-portable.ps1

      - name: Validate portable catalog
        shell: bash
        run: |
          set -euo pipefail
          source config/versions.conf

          all_releases="${OFBIZ_RELEASES_24_09} ${OFBIZ_RELEASES_18_12} ${OFBIZ_RELEASES_17_12}"

          while IFS= read -r version; do
            [[ -z "${version}" ]] && continue
            grep -Fxq "${version}" < <(printf '%s\n' ${all_releases})

            case "${version}" in
              24.09.*) test "${OFBIZ_JAVA_24_09}" = "17" ;;
              18.12.*) test "${OFBIZ_JAVA_18_12}" = "8" ;;
              17.12.*) test "${OFBIZ_JAVA_17_12}" = "8" ;;
              *) exit 1 ;;
            esac
          done <<< "${OFBIZ_PORTABLE_RELEASES}"

          mkdir -p "${RUNNER_TEMP}/portable-bootstrap-java8"
          javac --release 8 -d "${RUNNER_TEMP}/portable-bootstrap-java8" tools/portable/PortableBootstrap.java

      - name: Validate PowerShell tools
        shell: pwsh
        run: |
          foreach ($path in @(
            "install.ps1",
            "tools/portable/build-windows-portable.ps1",
            "tools/portable/test-windows-portable.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              Write-Host "Parser errors in $path"
              foreach ($parseError in $errors) {
                $line = $parseError.Extent.StartLineNumber
                $column = $parseError.Extent.StartColumnNumber
                $sourceLine = (Get-Content -Path $path)[$line - 1]
                Write-Host ("{0}:{1}:{2}: {3}" -f $path, $line, $column, $parseError.Message)
                Write-Host ("  {0}" -f $sourceLine)
              }
              exit 1
            }
          }

      - name: Validate packaged Windows installer
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_DIR="$RUNNER_TEMP/windows-installer"
          bash tools/package-windows-installer.sh "$PACKAGE_DIR"

          test -s "$PACKAGE_DIR/TurkuazOFBiz-Setup.zip"
          test -s "$PACKAGE_DIR/TurkuazOFBiz-Setup.zip.sha256"

          (
            cd "$PACKAGE_DIR"
            sha256sum -c TurkuazOFBiz-Setup.zip.sha256
            unzip -Z1 TurkuazOFBiz-Setup.zip | grep -Fxq "TurkuazOFBiz-Launcher.cmd"
            unzip -Z1 TurkuazOFBiz-Setup.zip | grep -Fxq "TurkuazOFBiz-Installer.ps1"
            unzip -Z1 TurkuazOFBiz-Setup.zip | grep -Fxq "README-FIRST.txt"
          )



  release-runtime-matrix:
    name: Release runtime ${{ matrix.version }} / Java ${{ matrix.java }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "17.12.09"
            java: "8"
          - version: "18.12.19"
            java: "8"
          - version: "24.09.07"
            java: "17"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install release through Service layer
        shell: bash
        env:
          OFBIZ_VERSION: ${{ matrix.version }}
          JAVA_MAJOR: ${{ matrix.java }}
        run: |
          set -euo pipefail

          export OFBIZ_INSTALL_ROOT="$RUNNER_TEMP/ofbiz"
          export OFBIZ_LOAD_DEMO=0

          source services/release-service.sh

          ofbiz_release_service_require_environment() {
            ofbiz_repository_init
          }

          ofbiz_release_service_install "$OFBIZ_VERSION"

          RUNTIME_PATH="$(ofbiz_repository_release_path "$OFBIZ_VERSION")"
          JAVA_HOME="$(ofbiz_repository_jdks_dir)/temurin-$JAVA_MAJOR"

          ofbiz_repository_install_is_valid             "$RUNTIME_PATH"             release             "$OFBIZ_VERSION"             "$JAVA_MAJOR"

          test "$(ofbiz_repository_current_path)" = "$RUNTIME_PATH"
          test "$(ofbiz_repository_metadata_value "$RUNTIME_PATH" type)" = "release"
          test "$(ofbiz_repository_metadata_value "$RUNTIME_PATH" identifier)" = "$OFBIZ_VERSION"
          test "$(ofbiz_repository_metadata_value "$RUNTIME_PATH" java_major)" = "$JAVA_MAJOR"

          ofbiz_release_service_install "$OFBIZ_VERSION"
          test "$(ofbiz_repository_current_path)" = "$RUNTIME_PATH"

          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "OFBIZ_RUNTIME_PATH=$RUNTIME_PATH" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

      - name: Verify Java mapping and Gradle build
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version
          test -x "$JAVA_HOME/bin/javac"

          cd "$OFBIZ_RUNTIME_PATH"
          ./gradlew --no-daemon --version
          ./gradlew --no-daemon help

      - name: Verify legacy portable dependency staging
        if: matrix.version == '17.12.09'
        shell: bash
        run: |
          set -euo pipefail

          STAGE_LIB="$RUNNER_TEMP/legacy-portable-lib"
          mkdir -p "$STAGE_LIB"

          cd "$OFBIZ_RUNTIME_PATH"
          ./gradlew --no-daemon \
            -I "$GITHUB_WORKSPACE/tools/portable/legacy-stage.init.gradle" \
            "-Dturkuaz.portable.lib=$STAGE_LIB" \
            turkuazPortableStage

          test -n "$(find "$STAGE_LIB" -maxdepth 1 -type f -name 'ofbiz*.jar' -print -quit)"
          test "$(find "$STAGE_LIB" -maxdepth 1 -type f -name '*.jar' | wc -l)" -gt 10

  snapshot-install-smoke:
    name: Snapshot install release24.09
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install snapshot through Service layer
        shell: bash
        run: |
          set -euo pipefail

          export OFBIZ_INSTALL_ROOT="$RUNNER_TEMP/ofbiz"
          export OFBIZ_LOAD_DEMO=0

          source services/snapshot-service.sh

          ofbiz_snapshot_service_require_environment() {
            ofbiz_repository_init
          }

          ofbiz_snapshot_service_install 24.09

          RUNTIME_PATH="$(ofbiz_repository_snapshot_path release24.09)"
          JAVA_HOME="$(ofbiz_repository_jdks_dir)/temurin-17"

          ofbiz_repository_install_is_valid             "$RUNTIME_PATH"             snapshot             release24.09             17

          test "$(ofbiz_repository_current_path)" = "$RUNTIME_PATH"
          test "$(ofbiz_repository_metadata_value "$RUNTIME_PATH" type)" = "snapshot"
          test "$(ofbiz_repository_metadata_value "$RUNTIME_PATH" identifier)" = "release24.09"
          test -d "$RUNTIME_PATH/.git"
          test -x "$JAVA_HOME/bin/java"

          cd "$RUNTIME_PATH"
          export JAVA_HOME
          export PATH="$JAVA_HOME/bin:$PATH"
          ./gradlew --no-daemon help

  doctor-smoke:
    name: Doctor smoke
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run full doctor
        shell: bash
        run: bash controllers/ofbiz.sh doctor all latest

  legacy-docker-smoke:
    name: Legacy Docker 17.12.09 / Java 8
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build 17.12.09 compat demo image
        shell: bash
        run: bash controllers/ofbiz.sh docker build release 17.12.09 demo

      - name: Verify compat image metadata and Java
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="local/ofbiz:release-17.12.09-demo"

          docker image inspect "$IMAGE" >/dev/null
          test "$(docker image inspect --format '{{ index .Config.Labels "org.turkuazlabs.turkuazofbiz.compat" }}' "$IMAGE")" = "true"
          docker run --rm --entrypoint java "$IMAGE" -version 2>&1 | tee "$RUNNER_TEMP/java-version.txt"
          grep -Eq '1\.8\.0|version "1\.8' "$RUNNER_TEMP/java-version.txt"

      - name: Run legacy compat HTTPS smoke
        shell: bash
        run: |
          set -euo pipefail

          CONTAINER="ofbiz-release-17-12-09"
          trap 'docker logs "$CONTAINER" || true; docker rm -f "$CONTAINER" >/dev/null 2>&1 || true' EXIT

          OFBIZ_HTTPS_PORT=18444             bash controllers/ofbiz.sh docker run release 17.12.09 demo

          for attempt in $(seq 1 72); do
            HTTP_CODE="$(curl               --insecure               --silent               --output /dev/null               --write-out '%{http_code}'               https://localhost:18444/webtools 2>/dev/null || true)"

            if [[ "$HTTP_CODE" =~ ^[23][0-9][0-9]$ ]]; then
              echo "Legacy OFBiz HTTPS ready with status $HTTP_CODE."
              exit 0
            fi

            if [[ "$(docker inspect --format '{{.State.Running}}' "$CONTAINER" 2>/dev/null || true)" != "true" ]]; then
              echo "Legacy OFBiz container stopped before readiness." >&2
              exit 1
            fi

            sleep 5
          done

          echo "Legacy OFBiz HTTPS readiness timeout." >&2
          exit 1

  docker-smoke:
    name: Docker smoke 24.09.07
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify official Docker tags
        shell: bash
        run: |
          docker manifest inspect ghcr.io/apache/ofbiz:24.09.07 >/dev/null
          docker manifest inspect ghcr.io/apache/ofbiz:24.09.07-preloaddemo >/dev/null
          docker manifest inspect ghcr.io/apache/ofbiz:trunk-snapshot >/dev/null
          docker manifest inspect ghcr.io/apache/ofbiz:release24.09-snapshot >/dev/null

      - name: Pull preloaded demo image
        shell: bash
        run: docker pull ghcr.io/apache/ofbiz:24.09.07-preloaddemo

      - name: Run real OFBiz smoke test
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f ofbiz-smoke >/dev/null 2>&1 || true' EXIT
          bash controllers/ofbiz.sh docker smoke release 24.09.07 demo

      - name: Validate 22.01 branch Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch release22.01             https://github.com/apache/ofbiz-framework.git             "$RUNNER_TEMP/ofbiz-22.01"
          docker build --check "$RUNNER_TEMP/ofbiz-22.01"
