# Dosya Yolu: /.github/workflows/release.yml
# Amac: Basarili main CI sonrasinda VERSION degerinden cok-surumlu portable paketler ve GitHub release olusturur
# Tool - YAML
# Version: 1.5.1
# Aciklama: Yalnizca current main CI sonucunu kabul eder, portable matrisini config'den cozer ve tekil release asset'lerini yayinlar
#
# Bagimli Oldugu Katman: Tool | View | Config

name: TurkuazOFBiz Release

on:
  workflow_run:
    workflows:
      - TurkuazOFBiz CI
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: turkuazofbiz-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  current-main:
    name: Verify current main
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.current.outputs.current }}

    steps:
      - name: Compare validated commit with current main
        id: current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"

          if [[ "${VALIDATED_SHA}" == "${CURRENT_MAIN_SHA}" ]]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
            echo "Validated commit is current main."
          else
            echo "current=false" >> "${GITHUB_OUTPUT}"
            echo "Validated commit is stale; portable release build will be skipped."
          fi

  portable-matrix:
    name: Resolve portable matrix
    needs:
      - current-main
    if: needs.current-main.outputs.current == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve matrix from config
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          source config/versions.conf

          matrix='{"include":[]}'
          while IFS= read -r version; do
            [[ -z "${version}" ]] && continue

            case "${version}" in
              24.09.*) java="${OFBIZ_JAVA_24_09}" ;;
              18.12.*) java="${OFBIZ_JAVA_18_12}" ;;
              17.12.*) java="${OFBIZ_JAVA_17_12}" ;;
              *)
                echo "Portable Java mapping missing for ${version}" >&2
                exit 1
                ;;
            esac

            matrix="$(jq -c --arg version "${version}" --arg java "${java}" '.include += [{version: $version, java: $java}]' <<< "${matrix}")"
          done <<< "${OFBIZ_PORTABLE_RELEASES}"

          if [[ "$(jq '.include | length' <<< "${matrix}")" -lt 1 ]]; then
            echo "Portable release matrix is empty." >&2
            exit 1
          fi

          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "${matrix}" | jq .

  portable-windows:
    name: Build Windows portable ${{ matrix.version }} / Java ${{ matrix.java }}
    needs:
      - portable-matrix
    if: needs.portable-matrix.result == 'success'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.portable-matrix.outputs.matrix) }}

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Temurin
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          architecture: x64

      - name: Build portable packages
        shell: pwsh
        env:
          OFBIZ_VERSION: ${{ matrix.version }}
        run: |
          $output = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          & .\tools\portable\build-windows-portable.ps1 -OFBizVersion $env:OFBIZ_VERSION -OutputDirectory $output

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Smoke test portable packages
        shell: pwsh
        env:
          OFBIZ_VERSION: ${{ matrix.version }}
          JAVA_MAJOR: ${{ matrix.java }}
        run: |
          $output = Join-Path $env:RUNNER_TEMP "portable"
          & .\tools\portable\test-windows-portable.ps1 -PackageDirectory $output -OFBizVersion $env:OFBIZ_VERSION -ExpectedJavaMajor $env:JAVA_MAJOR

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portable-windows-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/portable/*.zip
            ${{ runner.temp }}/portable/*.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish version
    needs:
      - current-main
      - portable-matrix
      - portable-windows
    if: >-
      needs.current-main.outputs.current == 'true' &&
      needs.portable-matrix.result == 'success' &&
      needs.portable-windows.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify validated commit is current main
        id: current
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"

          if [[ "${VALIDATED_SHA}" != "${CURRENT_MAIN_SHA}" ]]; then
            echo "Validated commit is no longer current main; skipping release."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Resolve release metadata
        if: steps.current.outputs.skip != 'true'
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: ${VERSION}" >&2
            exit 1
          fi

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to publish."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Download portable artifacts
        if: steps.current.outputs.skip != 'true' && steps.meta.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: portable-windows-*
          merge-multiple: true
          path: ${{ runner.temp }}/portable

      - name: Validate portable release assets
        if: steps.current.outputs.skip != 'true' && steps.meta.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          source config/versions.conf

          PORTABLE_DIR="${RUNNER_TEMP}/portable"

          while IFS= read -r version; do
            [[ -z "${version}" ]] && continue

            for mode in Demo Runtime; do
              asset="TurkuazOFBiz-Portable-${version}-${mode}-win-x64.zip"
              test -s "${PORTABLE_DIR}/${asset}"
              test -s "${PORTABLE_DIR}/${asset}.sha256"

              (
                cd "${PORTABLE_DIR}"
                sha256sum -c "${asset}.sha256"
              )
            done
          done <<< "${OFBIZ_PORTABLE_RELEASES}"

      - name: Publish GitHub Release
        if: steps.current.outputs.skip != 'true' && steps.meta.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          PACKAGE_DIR="${RUNNER_TEMP}/installer-package"
          PORTABLE_DIR="${RUNNER_TEMP}/portable"
          mkdir -p "${PACKAGE_DIR}"

          bash tools/package-windows-installer.sh "${PACKAGE_DIR}"

          cp install.ps1 "${PACKAGE_DIR}/TurkuazOFBiz-Installer.ps1"
          cp install.sh "${PACKAGE_DIR}/TurkuazOFBiz-Installer.sh"

          mapfile -t portable_assets < <(
            find "${PORTABLE_DIR}" -maxdepth 1 -type f \
              \( -name '*.zip' -o -name '*.sha256' \) \
              -print | sort
          )

          if [[ "${#portable_assets[@]}" -lt 4 ]]; then
            echo "Portable release assets missing." >&2
            exit 1
          fi

          gh release create "${TAG}" \
            "${portable_assets[@]}" \
            "${PACKAGE_DIR}/TurkuazOFBiz-Setup.zip" \
            "${PACKAGE_DIR}/TurkuazOFBiz-Setup.zip.sha256" \
            "${PACKAGE_DIR}/TurkuazOFBiz-Installer.ps1" \
            "${PACKAGE_DIR}/TurkuazOFBiz-Installer.sh" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${HEAD_SHA}" \
            --title "TurkuazOFBiz ${TAG}" \
            --notes-file RELEASE_NOTES.md \
            --latest
