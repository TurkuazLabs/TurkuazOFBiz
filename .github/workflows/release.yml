# Dosya Yolu: /.github/workflows/release.yml
# Amac: Basarili main CI sonrasinda VERSION degerinden GitHub tag ve release olusturur
# Tool - YAML
# Version: 1.2.0
# Aciklama: Stabil GitHub Release ile Windows, PowerShell ve Shell installer asset'lerini otomatik yayinlar
#
# Bagimli Oldugu Katman: Tool | View | Config

name: TurkuazOFBiz Release

on:
  workflow_run:
    workflows:
      - TurkuazOFBiz CI
    types:
      - completed

permissions:
  contents: write

jobs:
  release:
    name: Publish version
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify validated commit is current main
        id: current
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"

          if [[ "${VALIDATED_SHA}" != "${CURRENT_MAIN_SHA}" ]]; then
            echo "Validated commit is no longer current main; skipping release."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Resolve release metadata
        if: steps.current.outputs.skip != 'true'
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: ${VERSION}" >&2
            exit 1
          fi

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to publish."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        if: steps.current.outputs.skip != 'true' && steps.meta.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          cp install.bat "${RUNNER_TEMP}/TurkuazOFBiz-Installer.bat"
          cp install.ps1 "${RUNNER_TEMP}/TurkuazOFBiz-Installer.ps1"
          cp install.sh "${RUNNER_TEMP}/TurkuazOFBiz-Installer.sh"

          gh release create "${TAG}" \
            "${RUNNER_TEMP}/TurkuazOFBiz-Installer.bat" \
            "${RUNNER_TEMP}/TurkuazOFBiz-Installer.ps1" \
            "${RUNNER_TEMP}/TurkuazOFBiz-Installer.sh" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${HEAD_SHA}" \
            --title "TurkuazOFBiz ${TAG}" \
            --notes-file RELEASE_NOTES.md \
            --latest
