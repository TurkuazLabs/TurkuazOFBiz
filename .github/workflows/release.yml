# Dosya Yolu: /.github/workflows/release.yml
# Amac: Basarili main CI sonrasinda VERSION degerinden GitHub tag, portable paketler ve release olusturur
# Tool - YAML
# Version: 1.4.1
# Aciklama: Windows portable Demo/Runtime paketlerini gercek smoke testten gecirir ve installer asset'leriyle birlikte yayinlar
#
# Bagimli Oldugu Katman: Tool | View | Config

name: TurkuazOFBiz Release

on:
  workflow_run:
    workflows:
      - TurkuazOFBiz CI
    types:
      - completed

permissions:
  contents: write

jobs:
  portable-windows:
    name: Build Windows portable
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: windows-latest

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Temurin 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64

      - name: Build portable packages
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          & .\tools\portable\build-windows-portable.ps1 -OFBizVersion "24.09.07" -OutputDirectory $output

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Smoke test portable packages
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "portable"
          & .\tools\portable\test-windows-portable.ps1 -PackageDirectory $output -OFBizVersion "24.09.07"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portable-windows
          path: |
            ${{ runner.temp }}/portable/*.zip
            ${{ runner.temp }}/portable/*.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish version
    needs:
      - portable-windows
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify validated commit is current main
        id: current
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"

          if [[ "${VALIDATED_SHA}" != "${CURRENT_MAIN_SHA}" ]]; then
            echo "Validated commit is no longer current main; skipping release."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Resolve release metadata
        if: steps.current.outputs.skip != 'true'
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: ${VERSION}" >&2
            exit 1
          fi

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to publish."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Download portable artifacts
        if: steps.current.outputs.skip != 'true' && steps.meta.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: portable-windows
          path: ${{ runner.temp }}/portable

      - name: Publish GitHub Release
        if: steps.current.outputs.skip != 'true' && steps.meta.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          PACKAGE_DIR="${RUNNER_TEMP}/installer-package"
          PORTABLE_DIR="${RUNNER_TEMP}/portable"
          mkdir -p "${PACKAGE_DIR}"

          bash tools/package-windows-installer.sh "${PACKAGE_DIR}"

          cp install.ps1 "${PACKAGE_DIR}/TurkuazOFBiz-Installer.ps1"
          cp install.sh "${PACKAGE_DIR}/TurkuazOFBiz-Installer.sh"

          test -s "${PORTABLE_DIR}/TurkuazOFBiz-Portable-24.09.07-Demo-win-x64.zip"
          test -s "${PORTABLE_DIR}/TurkuazOFBiz-Portable-24.09.07-Demo-win-x64.zip.sha256"
          test -s "${PORTABLE_DIR}/TurkuazOFBiz-Portable-24.09.07-Runtime-win-x64.zip"
          test -s "${PORTABLE_DIR}/TurkuazOFBiz-Portable-24.09.07-Runtime-win-x64.zip.sha256"

          gh release create "${TAG}" \
            "${PORTABLE_DIR}/TurkuazOFBiz-Portable-24.09.07-Demo-win-x64.zip" \
            "${PORTABLE_DIR}/TurkuazOFBiz-Portable-24.09.07-Demo-win-x64.zip.sha256" \
            "${PORTABLE_DIR}/TurkuazOFBiz-Portable-24.09.07-Runtime-win-x64.zip" \
            "${PORTABLE_DIR}/TurkuazOFBiz-Portable-24.09.07-Runtime-win-x64.zip.sha256" \
            "${PACKAGE_DIR}/TurkuazOFBiz-Setup.zip" \
            "${PACKAGE_DIR}/TurkuazOFBiz-Setup.zip.sha256" \
            "${PACKAGE_DIR}/TurkuazOFBiz-Installer.ps1" \
            "${PACKAGE_DIR}/TurkuazOFBiz-Installer.sh" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${HEAD_SHA}" \
            --title "TurkuazOFBiz ${TAG}" \
            --notes-file RELEASE_NOTES.md \
            --latest
