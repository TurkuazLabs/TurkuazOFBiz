# Dosya Yolu: /config/runtime.conf
# Amac: OFBiz kurulum dizinleri ve runtime varsayilanlarini merkezi olarak tanimlar
# Config - Shell
# Version: 1.1.0
# Aciklama: Dizin, metadata ve kurulum davranis sabitlerini magic string olmadan yonetir
#
# Bagimli Oldugu Katman: Config

OFBIZ_DEFAULT_INSTALL_ROOT="/opt/ofbiz"
OFBIZ_DEFAULT_LOAD_DEMO="0"
OFBIZ_DEFAULT_FORCE_REINSTALL="0"

OFBIZ_RELEASES_DIR_NAME="releases"
OFBIZ_SNAPSHOTS_DIR_NAME="snapshots"
OFBIZ_JDKS_DIR_NAME="jdks"
OFBIZ_CURRENT_LINK_NAME="current"
OFBIZ_METADATA_FILE_NAME=".ofbiz-meta"

OFBIZ_RELEASE_DIR_PREFIX="apache-ofbiz-"
OFBIZ_SNAPSHOT_DIR_PREFIX="apache-ofbiz-snapshot-"

OFBIZ_TYPE_RELEASE="release"
OFBIZ_TYPE_SNAPSHOT="snapshot"
