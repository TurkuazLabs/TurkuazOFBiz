# Dosya Yolu: /config/docker.conf
# Amac: OFBiz Docker image, container, port ve resmi tag ayarlarini merkezi olarak tanimlar
# Config - Shell
# Version: 1.0.1
# Aciklama: Resmi GHCR image eslestirmeleri ile local build ve runtime varsayilanlarini tutar
#
# Bagimli Oldugu Katman: Config

OFBIZ_DOCKER_REGISTRY="ghcr.io/apache/ofbiz"
OFBIZ_DOCKER_LOCAL_IMAGE_PREFIX="local/ofbiz"

OFBIZ_DOCKER_VARIANT_RUNTIME="runtime"
OFBIZ_DOCKER_VARIANT_DEMO="demo"
OFBIZ_DOCKER_DEFAULT_VARIANT="runtime"

OFBIZ_DOCKER_RELEASE_DEMO_SUFFIX="-preloaddemo"

OFBIZ_DOCKER_SNAPSHOT_TRUNK_RUNTIME_TAG="trunk-snapshot"
OFBIZ_DOCKER_SNAPSHOT_TRUNK_DEMO_TAG="trunk-preloaddemo-snapshot"
OFBIZ_DOCKER_SNAPSHOT_24_09_RUNTIME_TAG="release24.09-snapshot"
OFBIZ_DOCKER_SNAPSHOT_24_09_DEMO_TAG="release24.09-preloaddemo-snapshot"

OFBIZ_DOCKER_DEFAULT_CONTAINER_NAME="ofbiz"
OFBIZ_DOCKER_DEFAULT_HTTPS_BIND="127.0.0.1"
OFBIZ_DOCKER_DEFAULT_HTTPS_PORT="8443"
OFBIZ_DOCKER_DEFAULT_DEBUG_PORT="5005"
OFBIZ_DOCKER_DEFAULT_DATA_LOAD="seed"
OFBIZ_DOCKER_DEFAULT_ADMIN_USER="admin"
OFBIZ_DOCKER_DEFAULT_HOST="localhost"

OFBIZ_DOCKER_SMOKE_CONTAINER="ofbiz-smoke"
OFBIZ_DOCKER_SMOKE_PORT="18443"
OFBIZ_DOCKER_SMOKE_TIMEOUT_SECONDS="360"
OFBIZ_DOCKER_SMOKE_URL="https://localhost:18443/partymgr"
